<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SDLC development lifecycle</title>
  <desc id="desc">A five-step flow from understand through plan, build, verify, and handoff, with a feedback arrow returning from verification to understanding when evidence changes.</desc>
  <style>
    .bg { fill: #f7f8fa; }
    .heading { fill: #172033; font: 700 34px system-ui, sans-serif; }
    .subheading { fill: #596579; font: 400 18px system-ui, sans-serif; }
    .card { fill: #ffffff; stroke: #c7cfdb; stroke-width: 2; }
    .number { fill: #ffffff; font: 700 18px system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .step { fill: #172033; font: 700 24px system-ui, sans-serif; text-anchor: middle; }
    .detail { fill: #596579; font: 400 16px system-ui, sans-serif; text-anchor: middle; }
    .arrow { fill: none; stroke: #6b778c; stroke-width: 4; marker-end: url(#arrowhead); }
    .feedback { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#feedback-arrowhead); }
    .feedback-label { fill: #6d28d9; font: 600 16px system-ui, sans-serif; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6b778c"/>
    </marker>
    <marker id="feedback-arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="560" rx="24"/>
  <text class="heading" x="70" y="70">Development managed by the SDLC skill</text>
  <text class="subheading" x="70" y="104">One coherent change, advanced only by current evidence.</text>

  <path class="arrow" d="M270 270 H300"/>
  <path class="arrow" d="M490 270 H520"/>
  <path class="arrow" d="M710 270 H740"/>
  <path class="arrow" d="M930 270 H960"/>

  <g>
    <rect class="card" x="60" y="170" width="210" height="200" rx="18"/>
    <circle cx="165" cy="205" r="22" fill="#2563eb"/>
    <text class="number" x="165" y="205">1</text>
    <text class="step" x="165" y="260">Understand</text>
    <text class="detail" x="165" y="300">Context</text>
    <text class="detail" x="165" y="326">Scope and outcome</text>
  </g>

  <g>
    <rect class="card" x="300" y="170" width="190" height="200" rx="18"/>
    <circle cx="395" cy="205" r="22" fill="#0e7490"/>
    <text class="number" x="395" y="205">2</text>
    <text class="step" x="395" y="260">Plan</text>
    <text class="detail" x="395" y="300">Approach</text>
    <text class="detail" x="395" y="326">Risks and checks</text>
  </g>

  <g>
    <rect class="card" x="520" y="170" width="190" height="200" rx="18"/>
    <circle cx="615" cy="205" r="22" fill="#047857"/>
    <text class="number" x="615" y="205">3</text>
    <text class="step" x="615" y="260">Build</text>
    <text class="detail" x="615" y="300">Small complete slices</text>
    <text class="detail" x="615" y="326">Tests with behavior</text>
  </g>

  <g>
    <rect class="card" x="740" y="170" width="190" height="200" rx="18"/>
    <circle cx="835" cy="205" r="22" fill="#b45309"/>
    <text class="number" x="835" y="205">4</text>
    <text class="step" x="835" y="260">Verify</text>
    <text class="detail" x="835" y="300">Fresh checks</text>
    <text class="detail" x="835" y="326">Risk-based review</text>
  </g>

  <g>
    <rect class="card" x="960" y="170" width="180" height="200" rx="18"/>
    <circle cx="1050" cy="205" r="22" fill="#7c3aed"/>
    <text class="number" x="1050" y="205">5</text>
    <text class="step" x="1050" y="260">Handoff</text>
    <text class="detail" x="1050" y="300">Outcome and evidence</text>
    <text class="detail" x="1050" y="326">Risks and limits</text>
  </g>

  <path class="feedback" d="M835 386 C835 500, 165 500, 165 386"/>
  <text class="feedback-label" x="500" y="530">If scope or implementation changes, reassess the evidence</text>
</svg>
