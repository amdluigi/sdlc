<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-labelledby="title desc">
  <title id="title">SDLC delivery phases</title>
  <desc id="desc">Seven delivery phases in order: inception, triage, design, implementation, verification, delivery, and operate. Triage through delivery carry evidence gates. Inception and operate declare no gate because they sit outside the per-change state machine. A feedback arrow returns from verification to triage when evidence changes.</desc>
  <style>
    .bg { fill: #f7f8fa; }
    .heading { fill: #172033; font: 700 34px system-ui, sans-serif; }
    .subheading { fill: #596579; font: 400 18px system-ui, sans-serif; }
    .card { fill: #ffffff; stroke: #c7cfdb; stroke-width: 2; }
    .card-ungated { fill: #fbfcfd; stroke: #c7cfdb; stroke-width: 2; stroke-dasharray: 7 6; }
    .number { fill: #ffffff; font: 700 17px system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .step { fill: #172033; font: 700 19px system-ui, sans-serif; text-anchor: middle; }
    .detail { fill: #596579; font: 400 13px system-ui, sans-serif; text-anchor: middle; }
    .gate { fill: #172033; font: 600 13px system-ui, sans-serif; text-anchor: middle; }
    .gate-none { fill: #6b778c; font: 400 13px system-ui, sans-serif; text-anchor: middle; }
    .arrow { fill: none; stroke: #6b778c; stroke-width: 4; marker-end: url(#arrowhead); }
    .feedback { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#feedback-arrowhead); }
    .feedback-label { fill: #6d28d9; font: 600 16px system-ui, sans-serif; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6b778c"/>
    </marker>
    <marker id="feedback-arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="580" rx="24"/>
  <text class="heading" x="70" y="70">Delivery phases managed by the SDLC skill</text>
  <text class="subheading" x="70" y="104">One coherent change, advanced only by current evidence.</text>

  <path class="arrow" d="M230 270 H258"/>
  <path class="arrow" d="M420 270 H448"/>
  <path class="arrow" d="M610 270 H638"/>
  <path class="arrow" d="M800 270 H828"/>
  <path class="arrow" d="M990 270 H1018"/>
  <path class="arrow" d="M1180 270 H1208"/>

  <g>
    <rect class="card-ungated" x="70" y="170" width="160" height="200" rx="18"/>
    <circle cx="150" cy="205" r="21" fill="#64748b"/>
    <text class="number" x="150" y="205">1</text>
    <text class="step" x="150" y="258">Inception</text>
    <text class="detail" x="150" y="292">Memory and standards</text>
    <text class="detail" x="150" y="314">Requirements and plan</text>
    <text class="gate-none" x="150" y="348">No gate</text>
  </g>

  <g>
    <rect class="card" x="260" y="170" width="160" height="200" rx="18"/>
    <circle cx="340" cy="205" r="21" fill="#2563eb"/>
    <text class="number" x="340" y="205">2</text>
    <text class="step" x="340" y="258">Triage</text>
    <text class="detail" x="340" y="292">Scope and invariants</text>
    <text class="detail" x="340" y="314">Root cause</text>
    <text class="gate" x="340" y="348">Gate 1</text>
  </g>

  <g>
    <rect class="card" x="450" y="170" width="160" height="200" rx="18"/>
    <circle cx="530" cy="205" r="21" fill="#0e7490"/>
    <text class="number" x="530" y="205">3</text>
    <text class="step" x="530" y="258">Design</text>
    <text class="detail" x="530" y="292">Contracts locked</text>
    <text class="detail" x="530" y="314">Specialist risk</text>
    <text class="gate" x="530" y="348">Gate 2</text>
  </g>

  <g>
    <rect class="card" x="640" y="170" width="160" height="200" rx="18"/>
    <circle cx="720" cy="205" r="21" fill="#047857"/>
    <text class="number" x="720" y="205">4</text>
    <text class="step" x="720" y="258">Implementation</text>
    <text class="detail" x="720" y="292">Test-first slices</text>
    <text class="detail" x="720" y="314">Minimal diff</text>
    <text class="gate" x="720" y="348">Gate 3</text>
  </g>

  <g>
    <rect class="card" x="830" y="170" width="160" height="200" rx="18"/>
    <circle cx="910" cy="205" r="21" fill="#b45309"/>
    <text class="number" x="910" y="205">5</text>
    <text class="step" x="910" y="258">Verification</text>
    <text class="detail" x="910" y="292">Fresh acceptance</text>
    <text class="detail" x="910" y="314">Independent review</text>
    <text class="gate" x="910" y="348">Gate 5</text>
  </g>

  <g>
    <rect class="card" x="1020" y="170" width="160" height="200" rx="18"/>
    <circle cx="1100" cy="205" r="21" fill="#7c3aed"/>
    <text class="number" x="1100" y="205">6</text>
    <text class="step" x="1100" y="258">Delivery</text>
    <text class="detail" x="1100" y="292">Release decision</text>
    <text class="detail" x="1100" y="314">Reviewable handoff</text>
    <text class="gate" x="1100" y="348">Gate 5</text>
  </g>

  <g>
    <rect class="card-ungated" x="1210" y="170" width="160" height="200" rx="18"/>
    <circle cx="1290" cy="205" r="21" fill="#64748b"/>
    <text class="number" x="1290" y="205">7</text>
    <text class="step" x="1290" y="258">Operate</text>
    <text class="detail" x="1290" y="292">Contain harm</text>
    <text class="detail" x="1290" y="314">Improve the process</text>
    <text class="gate-none" x="1290" y="348">No gate</text>
  </g>

  <path class="feedback" d="M910 386 C910 500, 340 500, 340 386"/>
  <text class="feedback-label" x="625" y="534">If scope or implementation changes, reassess the evidence</text>
</svg>
