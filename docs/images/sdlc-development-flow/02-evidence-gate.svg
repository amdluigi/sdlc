<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">How the SDLC skill handles each module</title>
  <desc id="desc">Four outcomes are shown. A module can be not applicable, configured disabled, satisfied with reusable evidence, or missing evidence that requires focused work. Readiness requires every applicable enabled module to be satisfied.</desc>
  <style>
    .bg { fill: #f7f8fa; }
    .heading { fill: #172033; font: 700 34px system-ui, sans-serif; text-anchor: middle; }
    .subheading { fill: #596579; font: 400 18px system-ui, sans-serif; text-anchor: middle; }
    .card { fill: #ffffff; stroke: #c7cfdb; stroke-width: 2; }
    .badge-text { fill: #ffffff; font: 700 15px system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .label { fill: #172033; font: 700 23px system-ui, sans-serif; text-anchor: middle; }
    .detail { fill: #596579; font: 400 16px system-ui, sans-serif; text-anchor: middle; }
    .success { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
    .success-text { fill: #065f46; font: 700 21px system-ui, sans-serif; text-anchor: middle; }
  </style>

  <rect class="bg" width="1200" height="560" rx="24"/>
  <text class="heading" x="600" y="62">How each module is handled</text>
  <text class="subheading" x="600" y="96">The skill chooses one evidence status, then takes only the needed action.</text>

  <g>
    <rect class="card" x="60" y="150" width="250" height="245" rx="18"/>
    <circle cx="185" cy="195" r="25" fill="#475569"/>
    <text class="badge-text" x="185" y="195">1</text>
    <text class="label" x="185" y="255">Does not apply</text>
    <text class="detail" x="185" y="300">Mark not applicable</text>
    <text class="detail" x="185" y="328">and skip the work</text>
  </g>

  <g>
    <rect class="card" x="335" y="150" width="250" height="245" rx="18"/>
    <circle cx="460" cy="195" r="25" fill="#b45309"/>
    <text class="badge-text" x="460" y="195">2</text>
    <text class="label" x="460" y="255">Disabled by config</text>
    <text class="detail" x="460" y="300">Skip the work</text>
    <text class="detail" x="460" y="328">and disclose it</text>
  </g>

  <g>
    <rect class="card" x="610" y="150" width="250" height="245" rx="18"/>
    <circle cx="735" cy="195" r="25" fill="#047857"/>
    <text class="badge-text" x="735" y="195">3</text>
    <text class="label" x="735" y="255">Evidence is current</text>
    <text class="detail" x="735" y="300">Mark satisfied</text>
    <text class="detail" x="735" y="328">and reuse the evidence</text>
  </g>

  <g>
    <rect class="card" x="885" y="150" width="250" height="245" rx="18"/>
    <circle cx="1010" cy="195" r="25" fill="#7c3aed"/>
    <text class="badge-text" x="1010" y="195">4</text>
    <text class="label" x="1010" y="255">Evidence has a gap</text>
    <text class="detail" x="1010" y="300">Load instructions</text>
    <text class="detail" x="1010" y="328">and fill only the gap</text>
  </g>

  <rect class="success" x="260" y="445" width="680" height="72" rx="18"/>
  <text class="success-text" x="600" y="489">Ready = every applicable enabled module is satisfied</text>
</svg>
